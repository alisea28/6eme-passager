<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Le 6ème passager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Text:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : une app mobile à une colonne, de nuit sur la route.
   Fond asphalte, accent ambre des lampadaires au sodium, documents sur papier kraft. */
:root{
  --asphalte:#121417;
  --asphalte-2:#1b1e23;
  --asphalte-3:#262a31;
  --ligne:#3a3f48;
  --texte:#e9e6df;
  --texte-doux:#a7a49c;
  --sodium:#f0a83a;
  --sodium-fonce:#b9741a;
  --kraft:#e8dcc2;
  --encre:#2a241b;
  --tampon:#c2412f;
  --ok:#5fb58a;
  --f-titre:"Big Shoulders Stencil Text","Arial Narrow",Impact,sans-serif;
  --f-texte:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--asphalte);color:var(--texte);font-family:var(--f-texte);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--asphalte)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête */
.entete{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--asphalte);border-bottom:1px solid var(--ligne);padding-block:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.marque{font-family:var(--f-titre);font-weight:800;letter-spacing:.04em;font-size:20px;text-transform:uppercase}
.marque span{color:var(--sodium)}
.chrono{font-family:var(--f-mono);font-size:13px;color:var(--sodium);font-variant-numeric:tabular-nums;text-align:right;line-height:1.2}
.chrono small{display:block;color:var(--texte-doux);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

main{flex:1;padding-block:20px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-titre);font-weight:800;text-transform:uppercase;letter-spacing:.03em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:44px}
h2{font-size:30px}
h3{font-size:20px;letter-spacing:.05em}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sodium)}
.doux{color:var(--texte-doux)}
.pile{display:flex;flex-direction:column;gap:12px}
.rangee{display:flex;gap:10px;flex-wrap:wrap}

/* Boutons */
.btn{appearance:none;border:0;border-radius:6px;padding:14px 18px;font-weight:600;cursor:pointer;background:var(--asphalte-3);color:var(--texte);text-align:center;min-height:48px}
.btn.principal{background:var(--sodium);color:#1a1205}
.btn.principal:active{background:var(--sodium-fonce)}
.btn.large{width:100%}
.btn.discret{background:transparent;border:1px solid var(--ligne)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Champs */
label{font-size:14px;color:var(--texte-doux)}
.champ{width:100%;padding:14px;border-radius:6px;border:1px solid var(--ligne);background:var(--asphalte-2);font-size:18px}
.champ.code{font-family:var(--f-mono);letter-spacing:.3em;text-transform:uppercase;text-align:center;font-size:24px}

/* Document kraft */
.doc{background:var(--kraft);color:var(--encre);border-radius:3px;padding:20px 18px;position:relative;font-family:var(--f-mono);font-size:15px;line-height:1.6;box-shadow:0 1px 0 rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6)}
.doc h2,.doc h3{color:var(--encre)}
.doc .ref{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-bottom:10px}
.doc p+p{margin-top:10px}
.tampon{display:inline-block;border:3px solid var(--tampon);color:var(--tampon);font-family:var(--f-titre);font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:2px 10px;transform:rotate(-4deg);font-size:18px;margin-bottom:10px}

/* Carte surface (écrans du jeu) */
.bloc{background:var(--asphalte-2);border:1px solid var(--ligne);border-radius:8px;padding:18px}
.bloc.secret{border-color:var(--sodium);background:linear-gradient(180deg,rgba(240,168,58,.10),transparent 60%),var(--asphalte-2)}
.erreur{color:#ff8a7a;font-size:14px}
.succes{color:var(--ok);font-weight:600}

/* Choix */
.options{display:flex;flex-direction:column;gap:10px}
.option{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:8px;border:1px solid var(--ligne);background:var(--asphalte-2);cursor:pointer;min-height:48px}
.option b{display:block;font-family:var(--f-titre);text-transform:uppercase;letter-spacing:.04em;font-size:18px}
.option.choisi{border-color:var(--sodium);background:rgba(240,168,58,.12)}
.option.faux{border-color:var(--tampon);opacity:.7}
.option.vrai{border-color:var(--ok)}

/* Sièges */
.sieges{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.siege{aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid var(--ligne);background:var(--asphalte-2);font-family:var(--f-titre);font-size:28px;font-weight:800;cursor:pointer}
.siege.choisi{background:var(--sodium);color:#1a1205;border-color:var(--sodium)}
.siege:disabled{opacity:.3;cursor:not-allowed}
.siege.choisi:disabled{opacity:1}

/* Appel */
.appel{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-block:20px}
.appel .num{font-family:var(--f-mono);font-size:22px;letter-spacing:.1em}
.onde{width:96px;height:96px;border-radius:50%;background:var(--asphalte-3);display:grid;place-items:center;font-size:40px;position:relative}
.onde.sonne::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--sodium);animation:pulse 1.2s infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.3);opacity:0}}
.transcription{font-family:var(--f-mono);font-size:15px;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px}
.transcription p{border-left:2px solid var(--sodium);padding-left:10px}

/* Photo */
.photo{background:#f3efe6;padding:12px 12px 40px;border-radius:2px;transform:rotate(-1.2deg);box-shadow:0 12px 30px -10px rgba(0,0,0,.7);position:relative}
.photo svg,.photo img{display:block;width:100%;height:auto}
.photo .legende{position:absolute;bottom:10px;left:14px;right:14px;font-family:var(--f-mono);font-size:13px;color:#3b342a}

/* Barre d'onglets */
.onglets{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--asphalte-2);border-top:1px solid var(--ligne);padding-bottom:env(safe-area-inset-bottom,0px)}
.onglets .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.onglet{background:none;border:0;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--texte-doux);cursor:pointer;position:relative}
.onglet svg{width:22px;height:22px}
.onglet.actif{color:var(--sodium)}
.onglet .pastille{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--tampon)}

/* Carte routière */
.carte{background:var(--asphalte-2);border:1px solid var(--ligne);border-radius:8px;overflow:hidden}
.carte svg{display:block;width:100%;height:auto}
.etape-liste{display:flex;flex-direction:column;gap:0}
.etape-liste .item{display:grid;grid-template-columns:28px 1fr;gap:10px;padding-block:10px;border-bottom:1px solid var(--ligne)}
.etape-liste .n{font-family:var(--f-titre);font-weight:800;font-size:20px;color:var(--sodium)}

/* Inventaire */
.objets{display:grid;grid-template-columns:1fr;gap:10px}
.objet{background:var(--asphalte-2);border:1px solid var(--ligne);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}
.objet .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-doux)}
.objet .tag.prive{color:var(--sodium)}

.vide{border:1px dashed var(--ligne);border-radius:8px;padding:20px;text-align:center;color:var(--texte-doux)}
.securite{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:rgba(240,168,58,.08);border:1px solid rgba(240,168,58,.35);border-radius:8px;padding:12px}
.code-reprise{font-family:var(--f-mono);word-break:break-all;background:var(--asphalte);border:1px solid var(--ligne);border-radius:6px;padding:10px;font-size:13px;user-select:all}
.progression{height:4px;background:var(--asphalte-3);border-radius:2px;overflow:hidden}
.progression i{display:block;height:100%;background:var(--sodium)}
@media (prefers-reduced-motion:reduce){.onde.sonne::after{animation:none}}
</style>

<div id="app">
  <header class="entete pad">
    <div class="marque">Le <span>6</span>ème passager</div>
    <div class="chrono" id="chrono"></div>
  </header>
  <main class="pad" id="vue"></main>
  <nav class="onglets" id="onglets" hidden>
    <div class="in pad" id="onglets-in"></div>
  </nav>
</div>

const CLE = "oTiTt/FSchx7Qhkg";

function decoder(b64, cle){
  const bin = atob(b64); const out = new Uint8Array(bin.length);
  const k = new TextEncoder().encode(cle);
  let x = 0x9e37;
  for(let i=0;i<bin.length;i++){ x = (Math.imul(x,1103515245) + 12345 + k[i%k.length]) & 0x7fffffff; out[i] = bin.charCodeAt(i) ^ (x & 0xff); }
  return JSON.parse(new TextDecoder().decode(out));
}
const SC = decoder(SCENARIO_B64, CLE);

/* ====== Utilitaires ====== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
function hash(str){ let h = 2166136261; for(const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h,16777619); } return h>>>0; }
function melanger(arr, graine){ const a = arr.slice(); let s = graine||1;
  const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s>>>15, 1|s); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; };
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function nouveauCode(mode){ const r = new Uint32Array(4); crypto.getRandomValues(r); return mode + [...r].map(v => ALPHA[v % ALPHA.length]).join(""); }

const STOCK = "sixieme-passager-" + SC.id;
function lireSauvegarde(){ try { return JSON.parse(localStorage.getItem(STOCK)); } catch(e){ return null; } }
function sauver(){ try { localStorage.setItem(STOCK, JSON.stringify(S)); } catch(e){} }
function effacerSauvegarde(){ try { localStorage.removeItem(STOCK); } catch(e){} }

/* ====== Étapes à plat ====== */
const ETAPES = [];
SC.chapitres.forEach((ch, ci) => ch.etapes.forEach(e => ETAPES.push(Object.assign({chapitre:ci}, e))));

/* ====== État ====== */
let S = null;      // état sauvegardé
let T = {};        // état temporaire de l'étape en cours (non sauvegardé)
let onglet = "enquete";

function nouvelEtat(code, siege, nom){
  return { code, siege, nom, i:0, flags:{}, verifs:0, verifsFaites:{}, indices:{}, choixPrives:{}, debut:Date.now(), vus:{} };
}
const mode = () => S.code[0] === "P" ? "pousse" : "classique";
const ordreRoles = () => melanger(Object.keys(SC.roles), hash(S.code.slice(1)));
const roleDuSiege = siege => ordreRoles()[siege-1];
const monRole = () => roleDuSiege(S.siege);
const R = () => SC.roles[monRole()];
function roleRevele(){
  if(mode() === "classique") return true;
  return ETAPES.some((e, k) => k < S.i && e.type === "role" && e.revelation && cond(e.si));
}

function cond(c){
  if(!c) return true;
  if(c.tous) return c.tous.every(cond);
  if(c.un) return c.un.some(cond);
  if(c.non) return !cond(c.non);
  if(c.mode) return mode() === c.mode;
  if(c.suspectEst) return S.flags.suspect != null && roleDuSiege(+S.flags.suspect) === c.suspectEst;
  if(c.flag){ const v = S.flags[c.flag]; return "egal" in c ? v === c.egal : v != null; }
  return true;
}
// Une étape est sautée si sa condition est fausse, ou si c'est un message secret qui n'est pas pour ce joueur
// (les autres ne doivent rien voir ni rien savoir).
function pourMoi(e){ return e.type !== "prive" || !!(e.messages && e.messages[monRole()]); }
function prochaineValide(depuis){ let k = depuis; while(k < ETAPES.length && (!cond(ETAPES[k].si) || !pourMoi(ETAPES[k]))) k++; return k; }
function etapeCourante(){ S.i = prochaineValide(S.i); return ETAPES[S.i]; }
function avancer(){ S.i = prochaineValide(S.i + 1); T = {}; sauver(); onglet = "enquete"; rendre(); window.scrollTo(0,0); }

/* Ce qui découle des étapes passées */
function passees(inclureCourante){ const lim = inclureCourante ? S.i : S.i - 1; return ETAPES.map((e,k)=>[e,k]).filter(([e,k]) => k <= lim && cond(e.si)); }
function inventaire(){
  const objets = [];
  passees(false).forEach(([e, k]) => {
    if(e.type === "objet") e.objets.forEach(o => { if(!o.role || o.role === monRole()) objets.push(o); });
    // Les photos et les documents sont rangés automatiquement pour pouvoir les revoir
    if(e.type === "photo" && e.garder !== false) objets.push({ id:"photo-"+k, nom:e.nomObjet || e.legende || "Photo", type:"photo", desc:`<div class="photo" style="transform:none;margin-top:6px">${e.image}<div class="legende">${esc(e.legende||"")}</div></div>${e.texte||""}` });
    if(e.type === "texte" && e.document && e.garder !== false) objets.push({ id:"doc-"+k, nom:e.titre || e.ref || "Document", type:"document", desc:`<div class="doc" style="margin-top:6px">${e.ref?`<div class="ref">${esc(e.ref)}</div>`:""}${e.texte}</div>` });
  });

/* ====== Chrono jusqu'à dimanche 18h ====== */
function echeance(){
  const d = new Date(S ? S.debut : Date.now());
  const fin = new Date(d); fin.setHours(SC.fin.heure, 0, 0, 0);
  let delta = (7 + SC.fin.jour - d.getDay()) % 7;
  if(delta === 0 && d > fin) delta = 7;
  fin.setDate(d.getDate() + delta);
  return fin;
}
function majChrono(){
  const el = $("#chrono");
  if(!S){ el.innerHTML = ""; return; }
  const ms = echeance() - Date.now();
  if(ms <= 0){ el.innerHTML = "<small>Temps écoulé</small>00:00:00"; return; }
  const h = Math.floor(ms/3600000), m = Math.floor(ms/60000)%60, s = Math.floor(ms/1000)%60;
  el.innerHTML = `<small>Dimanche 18h dans</small>${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

/* ====== Voix et sons ====== */
let lecteurAudio = null;
function parler(lignes, voix, onLigne, onFin, sons){
  stopVoix();
  if(sons && sons.length){
    // Voix enregistrées à l'avance : marchent sur tous les téléphones
    let n = 0, actif = {};
    lecteurAudio = actif;
    const suivant = () => {
      if(lecteurAudio !== actif) return;
      if(n >= sons.length){ onFin && onFin(true); return; }
      const a = new Audio(sons[n].startsWith("data:") ? sons[n] : "data:audio/wav;base64," + sons[n]);
      actif.a = a; onLigne && onLigne(n);
      a.onended = () => { n++; setTimeout(suivant, 350); };
      a.onerror = () => { n++; suivant(); };
      a.play().catch(() => { lecteurAudio = null; parler(lignes, voix, onLigne, onFin); });
    };
    suivant();
    return;
  }
  const synth = window.speechSynthesis;
  if(!synth){ onFin && onFin(false); return; }
  synth.cancel();
  const voixFr = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("fr"));
  lignes.forEach((txt, n) => {
    const u = new SpeechSynthesisUtterance(txt.replace(/<[^>]+>/g,""));
    u.lang = "fr-FR";
    if(voixFr.length) u.voice = voixFr[(voix && voix.index || 0) % voixFr.length];
    u.pitch = voix && voix.pitch || 1; u.rate = voix && voix.rate || .95;
    u.onstart = () => onLigne && onLigne(n);
    if(n === lignes.length-1){ u.onend = () => onFin && onFin(true); u.onerror = () => onFin && onFin(false); }
    synth.speak(u);
  });
}
function stopVoix(){
  if(lecteurAudio){ try { lecteurAudio.a && lecteurAudio.a.pause(); } catch(e){} lecteurAudio = null; }
  try { window.speechSynthesis && speechSynthesis.cancel(); } catch(e){}
}
let sonnerie = null;
function sonner(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let actif = true;
    const bip = () => { if(!actif) return;
      [0, .5].forEach(t0 => { const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 440; o.connect(g); g.connect(ctx.destination);
        const o2 = ctx.createOscillator(); o2.frequency.value = 480; o2.connect(g);
        g.gain.setValueAtTime(.0001, ctx.currentTime + t0); g.gain.exponentialRampToValueAtTime(.18, ctx.currentTime + t0 + .05);
        g.gain.setValueAtTime(.18, ctx.currentTime + t0 + .4); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + t0 + .45);
        o.start(ctx.currentTime + t0); o2.start(ctx.currentTime + t0); o.stop(ctx.currentTime + t0 + .5); o2.stop(ctx.currentTime + t0 + .5); });
      setTimeout(bip, 3000); };
    bip();
    try { navigator.vibrate && navigator.vibrate([400,200,400]); } catch(e){}
    sonnerie = { stop(){ actif = false; ctx.close(); } };
  } catch(e){ sonnerie = null; }
}
function stopSonnerie(){ if(sonnerie){ sonnerie.stop(); sonnerie = null; } }

/* ====== Salon connecté : qui est là, et qui prend quelle place ======
   Relais public ntfy.sh : seuls le pseudo et le numéro de place circulent. Les rôles restent calculés en secret sur chaque téléphone. */
const RELAIS = "https://ntfy.sh/";
let salon = null;
function sujetSalon(code){ return "sixieme-passager-" + hash(SC.id + "|" + code).toString(36) + "-" + code.toLowerCase(); }
function idJoueur(code){
  const k = "sixieme-passager-joueur-" + code;
  try { let id = localStorage.getItem(k); if(!id){ id = nouveauCode("x").slice(1) + nouveauCode("x").slice(1); localStorage.setItem(k, id); } return id; }
  catch(e){ return T.idTmp || (T.idTmp = nouveauCode("x").slice(1) + nouveauCode("x").slice(1)); }
}
function ajouterMessage(m){
  if(!salon || !m || m.event && m.event !== "message" || salon.msgs.some(x => x.id === m.id)) return false;
  let d; try { d = JSON.parse(m.message); } catch(e){ return false; }
  salon.msgs.push(Object.assign({ id: m.id, time: m.time }, d));
  salon.msgs.sort((a, b) => a.time - b.time || (a.id < b.id ? -1 : 1));
  return true;
}
function etatSalon(){
  const joueurs = [], places = {};
  for(const m of salon.msgs){
    if(m.t === "join"){ const j = joueurs.find(x => x.id === m.j); if(j) j.nom = m.nom; else joueurs.push({ id: m.j, nom: m.nom }); }
    if(m.t === "siege"){
      const j = joueurs.find(x => x.id === m.j);
      if(j && !j.siege && !places[m.s] && m.s >= 1 && m.s <= 5){ j.siege = m.s; places[m.s] = j.id; }
    }
  }
  const tour = joueurs.find(j => !j.siege);
  return { joueurs, places, tour, moi: joueurs.find(j => j.id === salon.moi) };
}
async function publierSalon(obj){
  const r = await fetch(RELAIS + salon.topic, { method: "POST", body: JSON.stringify(obj) });
  if(!r.ok) throw new Error("relais " + r.status);
  if(ajouterMessage(await r.json())) rendre();
}
function fermerSalon(){ if(salon && salon.es) salon.es.close(); salon = null; }
function ouvrirSalon(code, nom){
  fermerSalon();
  salon = { code, nom, topic: sujetSalon(code), moi: idJoueur(code), msgs: [], connecte: false, hors: false };
  const s = salon;
  try {
    s.es = new EventSource(RELAIS + s.topic + "/sse?since=all");
    s.es.onopen = () => { s.connecte = true; rendre(); };
    s.es.onmessage = ev => { try { if(ajouterMessage(JSON.parse(ev.data)) && T.ecran === "salon") rendre(); } catch(e){} };
  } catch(e){ s.hors = true; }
  publierSalon({ t: "join", j: s.moi, nom }).catch(() => { s.hors = true; rendre(); });
  setTimeout(() => { if(salon === s && !s.msgs.length){ s.hors = true; rendre(); } }, 8000);
}

  appel(e, el){
    const phase = T.phase || "sonne";
    if(phase === "sonne"){
      el.innerHTML = `<div class="appel"><div class="onde sonne" aria-hidden="true">☎</div><div class="eyebrow">Appel entrant</div><div class="num">${esc(e.appelant || "Numéro masqué")}</div>
        <p class="doux">Montez le son. Un seul téléphone suffit : tout le monde écoute.</p></div>
        <button class="btn principal large" id="decrocher">Décrocher</button>`;
      sonner();
      $("#decrocher").onclick = () => { stopSonnerie(); T.phase = "parle"; T.ligne = -1; rendre();
        parler(e.lignes, e.voix, n => { T.ligne = n; majTranscription(e); }, () => { T.fini = true; majTranscription(e); }, e.sons); };
      return;
    }
    el.innerHTML = `<div class="appel"><div class="onde" aria-hidden="true">☎</div><div class="num">${esc(e.appelant || "Numéro masqué")}</div><div class="eyebrow" id="etat-appel">En ligne</div></div>
      <div class="transcription" id="transcription"></div>
      <button class="btn discret large" id="reecouter">Réécouter</button>
      <button class="btn discret large" id="texte">Afficher tout le texte</button>
      <div id="apres"></div>`;
    $("#reecouter").onclick = () => { T.ligne = -1; T.fini = false; majTranscription(e); parler(e.lignes, e.voix, n => { T.ligne = n; majTranscription(e); }, () => { T.fini = true; majTranscription(e); }, e.sons); };
    $("#texte").onclick = () => { stopVoix(); T.ligne = e.lignes.length-1; T.fini = true; majTranscription(e); };
    majTranscription(e);
    // si aucune voix n'est disponible, tout afficher
    if(!window.speechSynthesis && !(e.sons && e.sons.length)){ T.ligne = e.lignes.length-1; T.fini = true; majTranscription(e); }
  },

  role(e, el){
    const r = R();
    if(e.revelation){
      el.innerHTML = `<div class="bloc secret pile"><div class="eyebrow">Révélation</div>${mode()==="pousse" ? `<p>${e.texte || "Les souvenirs se remettent en place. Tu sais maintenant qui tu es."}</p>` : `<p>${e.texteClassique || "Ton rôle est confirmé."}</p>`}</div>`
        + carteRole(r, true) + `<p class="doux">Garde ton écran pour toi.</p>` + boutonSuivant();
      return;
    }
    if(mode() === "pousse"){
      el.innerHTML = `<div class="bloc secret pile"><div class="eyebrow">Dossier personnel · Passager ${S.siege}</div><h3>Identité : incertaine</h3>
        <p>${r.avance && r.avance.intro || "Tu ne te souviens pas de tout. Les fragments reviendront."}</p></div>
        <p class="doux">Lis ton dossier en silence. Ne montre pas ton écran.</p>` + boutonSuivant();
      return;
    }
    el.innerHTML = `<p class="doux">Lis ton dossier en silence. Ne montre pas ton écran.</p>` + carteRole(r, true) + boutonSuivant(e.bouton || "J'ai lu mon dossier");
  },

  photo(e, el){
    el.innerHTML = `${e.intro?`<p>${e.intro}</p>`:""}<div class="photo">${e.image}<div class="legende">${esc(e.legende||"")}</div></div>${e.texte?`<div class="bloc">${e.texte}</div>`:""}` + boutonSuivant(e.bouton);
  },

  enigme(e, el){
    const k = S.i, nbIndices = S.indices[k] || 0;
    if(T.resolu){
      el.innerHTML = `<div class="bloc pile"><p class="succes">✓ ${esc(T.solution ? "Solution révélée." : "Bonne réponse.")}</p>${e.succes ? `<div>${e.succes}</div>` : ""}</div>` + boutonSuivant();
      return;
    }
    el.innerHTML = `<div class="${e.document?"doc":"bloc"} pile">${e.titre?`<h3>${esc(e.titre)}</h3>`:""}<div>${e.question}</div></div>
      ${(e.indices||[]).slice(0, nbIndices).map((ind,n) => `<div class="bloc"><div class="eyebrow">Indice ${n+1}</div><p>${ind}</p></div>`).join("")}
      ${inventaire().length ? `<button class="btn discret large" id="voir-objets">Revoir les photos, documents et objets</button>` : ""}
      <div class="pile"><label for="rep">Votre réponse</label><input class="champ" id="rep" autocomplete="off" autocapitalize="off"></div>
      <p class="erreur" id="err" hidden>Ce n'est pas ça. Relisez les indices et observez autour de vous.</p>
      <button class="btn principal large" id="valider">Valider</button>
      <div class="rangee">
        ${nbIndices < (e.indices||[]).length ? `<button class="btn discret" id="indice" style="flex:1">Un indice (${nbIndices+1}/${e.indices.length})</button>` : ""}
        ${nbIndices >= (e.indices||[]).length ? `<button class="btn discret" id="solution" style="flex:1">${T.confirme ? "Confirmer : voir la solution" : "On bloque : voir la solution"}</button>` : ""}
      </div>`;
    const valider = () => {
      const v = norm($("#rep").value);
      if(v && e.reponses.some(r => norm(r) === v)){ T.resolu = true; if(e.flag){ S.flags[e.flag] = "ok"; sauver(); } rendre(); } else { $("#err").hidden = false; }
    };
    $("#valider").onclick = valider;
    if($("#voir-objets")) $("#voir-objets").onclick = () => { onglet = "inventaire"; S.vus.inventaire = inventaire().length; sauver(); rendre(); window.scrollTo(0,0); };
    $("#rep").onkeydown = ev => { if(ev.key === "Enter") valider(); };
    if($("#indice")) $("#indice").onclick = () => { S.indices[k] = nbIndices + 1; sauver(); rendre(); };
    if($("#solution")) $("#solution").onclick = () => {
      if(!T.confirme){ T.confirme = true; rendre(); return; }
      T.resolu = true; T.solution = true; S.indices[k] = (S.indices[k]||0) + 2; sauver();
      rendre(); $("#etape").insertAdjacentHTML("afterbegin", `<div class="bloc"><div class="eyebrow">Solution</div><p>${esc(e.reponses[0])}</p></div>`);
    };
  },

  choix(e, el){
    T.faux = T.faux || [];
    el.innerHTML = `<div class="bloc pile">${e.titre?`<h3>${esc(e.titre)}</h3>`:""}<div>${e.question}</div></div>
      <div class="options">${e.options.map((o,n) => `<button class="option ${T.trouve&&o.correct?"vrai":""} ${T.faux.includes(n)?"faux":""}" data-n="${n}" ${T.trouve?"disabled":""}><b>${esc(o.label)}</b>${o.texte}</button>`).join("")}</div>
      <div id="retour-choix" class="pile">${T.dernier != null ? `<div class="bloc ${T.trouve?"":""}"><p class="${T.trouve?"succes":"erreur"}">${T.trouve ? "✓ " : ""}${e.options[T.dernier].retour || (T.trouve ? "C'est la bonne piste." : "Ce témoignage est cohérent. Cherchez ailleurs.")}</p></div>` : ""}</div>
      ${T.trouve && e.succes ? `<div class="bloc">${e.succes}</div>` : ""}
      ${T.trouve ? boutonSuivant() : ""}`;
    el.querySelectorAll(".option").forEach(b => b.onclick = () => {
      const n = +b.dataset.n; T.dernier = n;
      if(e.options[n].correct) T.trouve = true; else if(!T.faux.includes(n)) T.faux.push(n);
      rendre();
    });
  },

  destination(e, el){
    const phase = T.phase || "revele";
    if(phase === "revele"){
      el.innerHTML = `<div class="doc"><div class="ref">Destination débloquée</div><h2 style="color:var(--encre)">${esc(e.nom)}</h2><p>${esc(e.ville||"")}</p>${e.duree?`<p>Trajet estimé : ${esc(e.duree)}</p>`:""}</div>
        ${e.adresse ? `<p class="doux" style="font-family:var(--f-mono);font-size:14px">${esc(e.adresse)}</p>` : ""}
        <a class="btn large" style="text-decoration:none;display:block" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(e.adresse || e.lat+","+e.lng)}" target="_blank" rel="noopener">Ouvrir l'itinéraire (Google Maps)</a>
        <a class="btn large discret" style="text-decoration:none;display:block" href="${e.adresse ? "https://waze.com/ul?q="+encodeURIComponent(e.adresse)+"&navigate=yes" : "https://waze.com/ul?ll="+e.lat+","+e.lng+"&navigate=yes"}" target="_blank" rel="noopener">Ouvrir dans Waze</a>
        <button class="btn principal large" id="partir">On part</button>`;
      $("#partir").onclick = () => { T.phase = "route"; rendre(); };
      return;
    }
    if(phase === "route"){
      el.innerHTML = `<div class="securite"><span aria-hidden="true">⚠</span><div><b>Pendant le trajet, on pose les téléphones.</b> Le conducteur ne touche pas au jeu. Toutes les épreuves se font à l'arrêt.</div></div>
        <div class="bloc pile"><div class="eyebrow">En route vers ${esc(e.nom)}</div><h3>À discuter pendant le trajet</h3><p>${e.trajet || "Confrontez ce que vous savez. Qui vous semble cacher quelque chose ?"}</p></div>
        <button class="btn principal large" id="arrive">Nous sommes arrivés, la voiture est garée</button>`;
      $("#arrive").onclick = () => { T.phase = "sur-place"; rendre(); };
      return;
    }
    el.innerHTML = `<div class="bloc pile"><div class="eyebrow">Sur place · ${esc(e.nom)}</div>${e.histoire?`<h3>Un peu d'histoire</h3><div class="pile">${e.histoire}</div>`:""}</div>
      ${e.consigne?`<div class="bloc secret"><p>${e.consigne}</p></div>`:""}` + boutonSuivant("Commencer l'épreuve");
  },

  prive(e, el){
    const m = e.messages && e.messages[monRole()];
    const k = S.i;
    if(!m){ avancer(); return; }
    try { navigator.vibrate && navigator.vibrate(200); } catch(err){}
    const choix = S.choixPrives[k];
    el.innerHTML = `<div class="bloc secret pile"><div class="eyebrow">Message secret · pour toi seul</div>${e.titre?`<h3>${esc(e.titre)}</h3>`:""}<div>${m.texte}</div></div>
      ${m.decision === false ? "" : `<div class="pile"><p class="doux">Que fais-tu de ce message ?</p>
      <div class="options">${[["partage","Je le partage tel quel"],["reformule","Je le reformule à ma façon"],["garde","Je le garde pour moi"]].map(([v,l]) => `<button class="option ${choix===v?"choisi":""}" data-v="${v}">${l}</button>`).join("")}</div></div>`}
      ${boutonSuivant(null, m.decision !== false && !choix)}`;
    el.querySelectorAll(".option").forEach(b => b.onclick = () => { S.choixPrives[k] = b.dataset.v; sauver(); rendre(); });
  },

  audio(e, el){
    const f = e.fragments && e.fragments[monRole()];
    el.innerHTML = `<div class="bloc pile"><h3>${esc(e.titre || "Témoignage")}</h3><p>${e.consigne || "Chacun écoute son fragment, écouteur à l'oreille ou volume bas. Ensuite, mettez-vous d'accord."}</p></div>
      ${f ? `<div class="bloc secret pile"><div class="eyebrow">Ton fragment</div>
        <button class="btn principal large" id="ecouter">▶ Écouter mon fragment</button>
        <button class="btn discret large" id="lire">${T.lire ? "Masquer le texte" : "Lire le texte à la place"}</button>
        ${T.lire ? `<p style="font-family:var(--f-mono)">${f.texte}</p>` : ""}</div>` : `<div class="vide">Tu n'as pas de fragment pour ce témoignage. Écoute ce que les autres racontent.</div>`}
      ${boutonSuivant("Nous avons confronté nos fragments")}`;
    if(f){
      $("#ecouter").onclick = () => parler([f.texte], f.voix || e.voix, null, null, f.son ? [f.son] : null);
      $("#lire").onclick = () => { T.lire = !T.lire; rendre(); };
    }
  },

  objet(e, el){
    const vis = e.objets.filter(o => !o.role || o.role === monRole());
    el.innerHTML = `${e.texte?`<div class="bloc">${e.texte}</div>`:""}
      ${vis.length ? vis.map(o => `<div class="objet"><div class="tag ${o.role?"prive":""}">${o.role ? "Ajouté à ton inventaire privé" : "Ajouté à l'inventaire commun"}</div><h3>${esc(o.nom)}</h3><div>${o.desc}</div></div>`).join("") : `<div class="vide">Les autres ont peut-être trouvé quelque chose. Pas toi.</div>`}` + boutonSuivant();
  },

  vote(e, el){
    const phase = T.phase || "choisir";
    const opts = e.options === "joueurs" ? [1,2,3,4,5].map(n => ({valeur:String(n), label:"Passager "+n})) : e.options;
    if(phase === "choisir"){
      el.innerHTML = `<div class="bloc pile"><div class="eyebrow">Vote${e.secret!==false?" secret":""}</div><h3>${esc(e.question)}</h3>${e.texte?`<div>${e.texte}</div>`:""}</div>
        <p class="doux">Chacun vote sur son téléphone, sans montrer son écran.</p>
        <div class="options">${opts.map(o => `<button class="option ${T.monVote===o.valeur?"choisi":""}" data-v="${esc(o.valeur)}"><b>${esc(o.label)}</b>${o.texte||""}</button>`).join("")}</div>
        <button class="btn principal large" id="voter" ${T.monVote?"":"disabled"}>Valider mon vote</button>`;
      el.querySelectorAll(".option").forEach(b => b.onclick = () => { T.monVote = b.dataset.v; rendre(); });
      $("#voter").onclick = () => { T.phase = "attendre"; rendre(); };
      return;
    }
    if(phase === "attendre"){
      el.innerHTML = `<div class="bloc pile" style="text-align:center"><p>Vote enregistré.</p><p class="doux">Quand tout le monde a voté, retournez vos téléphones en même temps.</p></div>
        <button class="btn principal large" id="montrer">Tout le monde a voté : on révèle</button>`;
      $("#montrer").onclick = () => { T.phase = "montre"; rendre(); };
      return;
    }
    if(phase === "montre"){
      const o = opts.find(o => o.valeur === T.monVote);
      el.innerHTML = `<div class="bloc secret" style="text-align:center;padding-block:40px"><div class="eyebrow">Mon vote</div><div style="font-family:var(--f-titre);font-size:48px;font-weight:800;text-transform:uppercase;line-height:1">${esc(o.label)}</div></div>
        <p class="doux">Montrez vos écrans. Comptez les voix. En cas d'égalité, ${esc(e.egalite || "discutez puis revotez à main levée")}.</p>
        <button class="btn principal large" id="resultat">Saisir le résultat du groupe</button>`;
      $("#resultat").onclick = () => { T.phase = "resultat"; rendre(); };
      return;
    }
    el.innerHTML = `<div class="bloc pile"><h3>Résultat du groupe</h3><p class="doux">Choisissez la même réponse sur les 5 téléphones, sinon vos histoires vont diverger.</p></div>
      <div class="options">${opts.map(o => `<button class="option ${T.groupe===o.valeur?"choisi":""}" data-v="${esc(o.valeur)}"><b>${esc(o.label)}</b></button>`).join("")}</div>
      ${T.groupe && e.consequences && e.consequences[T.groupe] ? `<div class="bloc">${e.consequences[T.groupe]}</div>` : ""}
      ${boutonSuivant("Confirmer le résultat", !T.groupe)}`;
    el.querySelectorAll(".option").forEach(b => b.onclick = () => { T.groupe = b.dataset.v; rendre(); });
    $("#suivant").onclick = () => { S.flags[e.flag] = T.groupe; avancer(); };
  },

  quiz_perso(e, el){
    const q = e.questions && e.questions[monRole()];
    if(!q){ el.innerHTML = `<div class="vide">Pas de question pour toi ici.</div>` + boutonSuivant(); return; }
    if(T.fait){
      el.innerHTML = `<div class="bloc secret pile"><p>Réponse enregistrée. Tu sauras à la fin si tu as réussi ta mission.</p></div>` + boutonSuivant();
      return;
    }
    el.innerHTML = `<div class="bloc secret pile"><div class="eyebrow">Ta mission personnelle</div><h3>${esc(R().objectif)}</h3><p>${q.question}</p></div>
      ${q.options ? `<div class="options">${q.options.map(o => `<button class="option ${T.rep===o?"choisi":""}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>` :
      `<input class="champ" id="rep" autocomplete="off">`}
      <p class="doux">Une seule réponse, définitive.</p>
      <button class="btn principal large" id="valider">Valider ma réponse</button>`;
    el.querySelectorAll(".option").forEach(b => b.onclick = () => { T.rep = b.dataset.v; rendre(); });
    $("#valider").onclick = () => {
      const v = q.options ? T.rep : $("#rep").value;
      if(!v) return;
      S.flags["mission_" + monRole()] = q.reponses.some(r => norm(r) === norm(v)) ? "ok" : "rate";
      sauver(); T.fait = true; rendre();
    };
  },

  pause(e, el){
    el.innerHTML = `<div class="doc pile"><div class="ref">Pause · progression sauvegardée</div><h3>${esc(e.titre || "Fin de la journée")}</h3><div>${e.texte}</div></div>
      <div class="bloc pile"><p>Vous pouvez fermer le site. Demain, rouvrez-le et appuyez sur « Reprendre ».</p></div>` + boutonSuivant(e.bouton || "Reprendre l'enquête");
  },

  fin(e, el){
    const fin = SC.fins.find(f => cond(f.si)) || SC.fins[SC.fins.length-1];
    const ordre = ordreRoles();
    el.innerHTML = `<div class="doc pile"><div class="ref">Dossier 006 · clôturé</div><div class="tampon">${esc(fin.niveau)}</div><h2 style="color:var(--encre)">${esc(fin.titre)}</h2><div>${fin.texte}</div></div>
      <div class="pile"><h3>Qui était qui</h3>
      ${ordre.map((rid, n) => { const r = SC.roles[rid]; const mis = S.flags["mission_"+rid];
        const res = rid === "complice" ? (cond({suspectEst:"complice"}) ? "Démasqué" : "Jamais démasqué") : (mis === "ok" ? "Mission réussie" : mis === "rate" ? "Mission ratée" : "Résultat affiché sur son téléphone");
        return `<div class="objet"><div class="tag">Passager ${n+1}${n+1===S.siege?" · toi":""}</div><h3>${esc(r.icone)} ${esc(r.nom)}</h3><p>${esc(r.objectif)}</p><p class="${/réussie|Jamais/.test(res)?"succes":"doux"}">${res}</p></div>`; }).join("")}
      </div>
      ${SC.verite ? `<details class="bloc"><summary><b>Toute la vérité</b></summary><div class="pile" style="margin-top:12px">${SC.verite}</div></details>` : ""}
      <div class="bloc pile"><h3>Tes secrets du week-end</h3><p class="doux">Chacun lit à voix haute ce qu'il a reçu et ce qu'il en a fait.</p>
      ${journal().map(j => `<div><b>${esc(j.titre)}</b>${j.choix?` · <span class="doux">${({partage:"partagé tel quel",reformule:"reformulé",garde:"gardé secret"})[j.choix]}</span>`:""}<p class="doux" style="font-family:var(--f-mono);font-size:14px">${j.texte}</p></div>`).join("") || `<p class="doux">Aucun.</p>`}</div>
      <p class="doux">Indices utilisés : ${Object.values(S.indices).reduce((a,b)=>a+b,0)}</p>
      <button class="btn discret large" id="nouvelle">Effacer la partie de ce téléphone</button>`;
    $("#nouvelle").onclick = () => { if(!T.conf){ T.conf = true; $("#nouvelle").textContent = "Confirmer : effacer la partie"; return; } effacerSauvegarde(); S = null; T = {}; rendre(); };
  }
};

function majTranscription(e){
  const t = $("#transcription"); if(!t) return;
  t.innerHTML = e.lignes.slice(0, T.ligne+1).map(l => `<p>${esc(l)}</p>`).join("");
  const etat = $("#etat-appel"); if(etat) etat.textContent = T.fini ? "Appel terminé" : "En ligne";
  if(T.fini && $("#apres") && !$("#apres").innerHTML){ $("#apres").innerHTML = (e.apres ? `<div class="bloc">${e.apres}</div>` : "") + boutonSuivant(); lierSuivant(); }
}

/* ====== Rôle ====== */
function carteRole(r, complet){
  return `<div class="doc pile"><div class="ref">Dossier confidentiel · Passager ${S.siege}${S.nom?" · "+esc(S.nom):""}</div><div class="tampon">Personnel</div>
    <h2 style="color:var(--encre)">${esc(r.icone)} ${esc(r.nom)}</h2>
    <p><b>Capacité :</b> ${esc(r.capacite)}</p>
    ${complet ? `<p><b>Ton secret :</b> ${esc(r.secret)}</p><p><b>Ton objectif :</b> ${esc(r.objectif)}</p>` : ""}
    ${r.verifications ? `<p><b>Vérifications d'authenticité :</b> ${r.verifications - S.verifs} restante(s), depuis l'onglet Objets.</p>` : ""}</div>`;
}
function ecranRole(vue){
  const r = R();
  const souvenirs = journal().filter(j => /souvenir/i.test(j.titre));
  vue.innerHTML = (roleRevele() ? carteRole(r, true) :
    `<div class="bloc secret pile"><div class="eyebrow">Passager ${S.siege}</div><h3>Identité : incertaine</h3><p>${r.avance && r.avance.intro || "Tu ne sais pas encore qui tu es."}</p>
      ${souvenirs.length ? `<p class="doux">Souvenirs retrouvés : ${souvenirs.length}. Relis-les dans l'onglet Secrets.</p>` : ""}</div>`) +
    `<div class="bloc pile"><h3>Code de reprise</h3><p class="doux" style="font-size:14px">La partie est sauvegardée automatiquement sur ce téléphone. Si elle disparaît, recopiez ce code dans l'écran d'accueil.</p>
      <div class="code-reprise" id="cr">${codeReprise()}</div><button class="btn discret" id="copier">Copier le code</button></div>
    <div class="bloc pile"><p class="doux" style="font-size:14px">Partie ${esc(S.code)} · version ${mode()==="pousse"?"poussée":"classique"}</p>
      <button class="btn discret" id="quitter">Quitter (la sauvegarde reste)</button></div>`;
  $("#copier").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(codeReprise()).then(() => $("#copier").textContent = "Copié", () => { const s = getSelection(), rg = document.createRange(); rg.selectNodeContents($("#cr")); s.removeAllRanges(); s.addRange(rg); }); };
  $("#quitter").onclick = () => { sauver(); S = null; T = {}; rendre(); };
}

/* ====== Inventaire ====== */
function ecranInventaire(vue){
  const objs = inventaire(), r = R(), peutVerifier = roleRevele() && r.verifications && S.verifs < r.verifications;
  const commun = objs.filter(o => !o.role), prive = objs.filter(o => o.role);
  const carte = o => `<div class="objet"><div class="tag ${o.role?"prive":""}">${o.role?"Privé":"Commun"}${o.type?" · "+esc(o.type):""}</div><h3>${esc(o.nom)}</h3><div>${o.desc}</div>
    ${S.verifsFaites[o.id] ? `<p class="${S.verifsFaites[o.id]==="vrai"?"succes":"erreur"}">${S.verifsFaites[o.id]==="vrai"?"✓ Authentique":"✗ Falsifié"}</p>` :
      (peutVerifier && o.authentique != null ? `<button class="btn discret" data-verif="${esc(o.id)}">Vérifier l'authenticité</button>` : "")}</div>`;
  vue.innerHTML = `<div class="pile"><div class="eyebrow">Inventaire</div><h2>Objets et preuves</h2></div>
    <h3>Commun</h3>${commun.length ? `<div class="objets">${commun.map(carte).join("")}</div>` : `<div class="vide">Rien pour l'instant. Les preuves trouvées apparaîtront ici.</div>`}
    <h3>Privé</h3>${prive.length ? `<div class="objets">${prive.map(carte).join("")}</div>` : `<div class="vide">Tes objets secrets apparaîtront ici. Personne d'autre ne les voit.</div>`}`;
  vue.querySelectorAll("[data-verif]").forEach(b => b.onclick = () => {
    const o = objs.find(x => x.id === b.dataset.verif);
    S.verifsFaites[o.id] = o.authentique ? "vrai" : "faux"; S.verifs++; sauver(); rendre();
  });
}

/* ====== Carte routière ====== */
function ecranCarte(vue){
  const pts = [SC.depart, ...destinations()].filter(Boolean);
  if(pts.length < 1){ vue.innerHTML = `<div class="vide">Aucune destination débloquée.</div>`; return; }
  const lats = pts.map(p=>p.lat), lngs = pts.map(p=>p.lng);
  const minLa = Math.min(...lats), maxLa = Math.max(...lats), minLn = Math.min(...lngs), maxLn = Math.max(...lngs);
  const W = 400, H = 340, m = 50;
  const kx = Math.cos((minLa+maxLa)/2*Math.PI/180);
  const spanX = Math.max((maxLn-minLn)*kx, .02), spanY = Math.max(maxLa-minLa, .02);
  const sc = Math.min((W-2*m)/spanX, (H-2*m)/spanY);
  const cx = (minLn+maxLn)/2, cy = (minLa+maxLa)/2;
  const X = p => W/2 + (p.lng-cx)*kx*sc, Y = p => H/2 - (p.lat-cy)*sc;
  const chemin = pts.map((p,n) => `${n?"L":"M"}${X(p).toFixed(1)},${Y(p).toFixed(1)}`).join(" ");
  // échelle : 10 km
  const kmPx = sc * kx / (111.32 * kx); // px par km (≈ sc/111)
  const barre = Math.max(10, Math.min(120, 10*kmPx*(spanX*111>60?2:1)));
  const barreKm = spanX*111>60 ? 20 : 10;
  vue.innerHTML = `<div class="pile"><div class="eyebrow">Itinéraire reconstitué</div><h2>La carte</h2><p class="doux">Les lieux apparaissent au fur et à mesure que vous les découvrez.</p></div>
    <div class="carte"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Carte des destinations débloquées">
      <defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--asphalte-3)" stroke-width="1"/></pattern></defs>
      <rect width="${W}" height="${H}" fill="url(#g)"/>
      <path d="${chemin}" fill="none" stroke="var(--sodium)" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
      ${pts.map((p,n) => { const x = X(p), y = Y(p), droite = x < W*0.5;
        const deja = pts.slice(0, n).some(o => Math.abs(X(o)-x) < 4 && Math.abs(Y(o)-y) < 4);
        const nomCourt = (n ? (p.ville || p.nom) : p.nom).split(/[,(]/)[0].trim();
        return `<circle cx="${x}" cy="${y}" r="${n?7:9}" fill="${n?"var(--sodium)":"var(--texte)"}" stroke="var(--asphalte)" stroke-width="3"/>
        ${deja ? "" : `<text x="${droite?x+12:x-12}" y="${y+4}" text-anchor="${droite?"start":"end"}" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--texte)">${n?n+". ":""}${esc(nomCourt)}</text>`}`; }).join("")}
      <g transform="translate(${W-30},28)"><path d="M0-14 5 4 0 0-5 4Z" fill="var(--texte-doux)"/><text y="18" text-anchor="middle" font-size="10" fill="var(--texte-doux)" font-family="IBM Plex Mono, monospace">N</text></g>
      <g transform="translate(16,${H-18})"><path d="M0 0H${(barreKm*sc/111).toFixed(1)}" stroke="var(--texte-doux)" stroke-width="2"/><text y="-6" font-size="10" fill="var(--texte-doux)" font-family="IBM Plex Mono, monospace">${barreKm} km</text></g>
    </svg></div>
    <div class="etape-liste">${pts.map((p,n) => `<div class="item"><div class="n">${n||"●"}</div><div><b>${esc(p.nom)}</b><div class="doux" style="font-size:14px">${esc(p.ville||"")}</div></div></div>`).join("")}</div>`;
}
